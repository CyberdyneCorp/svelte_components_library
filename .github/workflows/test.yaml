name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # The Storybook vitest project renders stories in a real browser via
      # Playwright — install the browser + its OS deps before running tests.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
